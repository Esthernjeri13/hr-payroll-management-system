<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>HR & Payroll</strong>
        <span>Login</span>
      </div>
      <nav class="nav">
        <a class="active" href="./login.html">Login</a>
        <a href="./register.html">Register</a>
      </nav>
    </header>

    <main class="page" style="max-width: 640px;">
      <section class="panel">
        <h1>Welcome back</h1>
        <p class="muted">Use your email and password to continue.</p>
        <form id="loginForm" class="form">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" required />
          </div>
          <div class="actions">
            <button class="primary" type="submit">Login</button>
          </div>
        </form>
        <p id="loginStatus" class="status"></p>
        <p class="muted">No account yet? <a class="subtle-link" href="./register.html">Create one here.</a></p>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/login.js"></script>
  </body>
</html>
