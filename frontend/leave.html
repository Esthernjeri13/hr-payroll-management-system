<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>HR & Payroll</strong>
        <span>Leave management</span>
      </div>
      <nav class="nav">
        <a href="./index.html">Dashboard</a>
        <a href="./employees.html">Employees</a>
        <a class="active" href="./leave.html">Leave</a>
        <a href="./payroll.html">Payroll</a>
        <a href="./notification.html">Notifications</a>
      </nav>
    </header>

    <main class="page">
      <section class="grid two">
        <div class="panel">
          <h2>Submit leave request</h2>
          <form id="leaveForm" class="form">
            <div class="row">
              <div class="field">
                <label for="leaveType">Leave type</label>
                <select id="leaveType" required>
                  <option value="Annual">Annual</option>
                  <option value="Unpaid">Unpaid</option>
                  <option value="Sick">Sick</option>
                  <option value="Emergency">Emergency</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="field">
                <label for="leaveStartDate">Start date</label>
                <input id="leaveStartDate" type="date" required />
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="leaveEndDate">End date</label>
                <input id="leaveEndDate" type="date" required />
              </div>
              <div class="field">
                <label>&nbsp;</label>
                <button class="primary" type="submit">Submit request</button>
              </div>
            </div>
          </form>
          <p id="leaveFormStatus" class="status"></p>
        </div>

        <div class="card">
          <h2>Leave requests</h2>
          <div id="leaveListStatus" class="status">Loading leave requests...</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Period</th>
                  <th>Type</th>
                  <th>Days</th>
                  <th>Status</th>
                  <th>Manager comments</th>
                </tr>
              </thead>
              <tbody id="leaveListBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/leave.js"></script>
  </body>
</html>
